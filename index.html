<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cursor Critters — garden sim</title>
  </head>
  <body>
    <div id="app">
      <canvas id="garden"></canvas>
      <div id="hud">
        <span class="pill" id="tick">t 0</span>
        <span class="pill" id="seed">seed —</span>
        <span class="pill" id="counts">—</span>
        <span
          class="pill"
          id="you"
          title="your critter — click to travel · G graze · I idle · F pick fruit · D drop · V dive · R drift · shift-click startles"
          hidden
        >—</span>
        <span
          class="pill"
          id="goal"
          title="your secret objective — do it while the window is open, at the marked spot; the crowd will be doing it too"
          hidden
        >—</span>
        <span class="spacer"></span>
        <label class="toggle"
          ><span>play</span>
          <select id="play" title="control one critter of this species">
            <option value="off">off</option>
            <option value="ground">ground</option>
            <option value="tree">tree</option>
            <option value="water">water</option>
          </select>
        </label>
        <button id="pause" title="Space">pause</button>
        <button id="speed" title="cycle sim speed">1×</button>
        <button id="reseed" title="new garden">reseed</button>
        <label class="toggle"
          ><input type="checkbox" id="labels" /> <span>labels</span></label
        >
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
